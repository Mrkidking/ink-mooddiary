<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E8927C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INK日记">
<link rel="manifest" href="./manifest.json">
<title>INK — 心情日记</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --bg-primary: #FDF8F5;
    --bg-secondary: #F8F2ED;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FDF8F5;
    --bg-elevated: #F5F0EB;
    --border: #F0E8E0;
    --border-light: #E8DED4;
    --text-primary: #3D322C;
    --text-secondary: #8B7D72;
    --text-muted: #A8988A;
    --gradient-ins: linear-gradient(135deg, #F0A89A, #E8927C, #D4A574);
    --gradient-ins-h: linear-gradient(90deg, #F0A89A, #E8927C, #D4A574);
    --gradient-story: linear-gradient(45deg, #F0A89A, #E8927C, #D4A574);
    --accent-blue: #E8927C;
    --accent-blue-hover: #D4816F;
    --accent-pink: #F0A89A;
    --accent-purple: #C9A87C;
    --accent-green: #7CBF8A;
    --accent-yellow: #D4A574;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-2xl: 24px;
    --radius-full: 9999px;
    --shadow-sm: 0 1px 2px rgba(61,50,44,0.06);
    --shadow: 0 4px 12px rgba(61,50,44,0.08);
    --shadow-lg: 0 8px 32px rgba(61,50,44,0.1);
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
  }

  /* ---- LAYOUT ---- */
  .app { display:flex; min-height:100vh; max-width:1400px; margin:0 auto; }

  /* ---- SIDEBAR ---- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid var(--border);
    background: rgba(253,248,245,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    text-decoration: none;
  }
  .logo-icon {
    width: 38px; height: 38px;
    border-radius: var(--radius);
    background: var(--gradient-ins);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: var(--gradient-ins-h);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav { flex:1; display:flex; flex-direction:column; gap:2px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    position: relative;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
  .nav-item.active { color: var(--text-primary); font-weight: 600; }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    border-radius: 0 4px 4px 0;
    background: var(--gradient-ins);
  }
  .nav-icon {
    width: 24px; height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .nav-icon svg { width: 22px; height: 22px; }
  .nav-item.active .nav-icon svg { stroke: var(--text-primary); }
  .nav-badge {
    margin-left: auto;
    background: var(--accent-blue);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    min-width: 22px;
    text-align: center;
  }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 8px;
  }
  .user-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
  }
  .user-card:hover { background: var(--bg-card); }
  .user-avatar {
    width: 38px; height: 38px;
    border-radius: var(--radius-full);
    background: var(--gradient-story);
    padding: 2px;
    flex-shrink: 0;
  }
  .user-avatar-placeholder {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-secondary);
    border: 2px solid var(--bg-primary);
  }
  .user-info { flex:1; min-width:0; }
  .user-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-handle { font-size:12px; color:var(--text-muted); }

  /* ---- MAIN CONTENT ---- */
  .main {
    flex:1;
    min-width:0;
    display:flex;
    gap: 0;
  }
  .feed {
    flex:1;
    min-width:0;
    max-width: 600px;
    border-right: 1px solid var(--border);
  }
  .view { display:none; flex-direction:column; flex:1; }
  .view.active { display:flex; }

  /* ---- TOP BAR ---- */
  .topbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(253,248,245,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 50;
  }
  .topbar-title { font-size:18px; font-weight:700; letter-spacing:-0.3px; }

  /* ---- BUTTONS ---- */
  .btn-post {
    padding: 8px 22px;
    border-radius: var(--radius-full);
    background: var(--gradient-ins-h);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    font-family: inherit;
  }
  .btn-post::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.2);
    opacity: 0;
    transition: opacity var(--transition);
  }
  .btn-post:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(240,168,154,0.4); }
  .btn-post:hover::after { opacity: 1; }
  .btn-post:active { transform: scale(0.97); }
  .btn-outline {
    padding: 8px 18px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .btn-outline:hover { background: var(--bg-elevated); transform: translateY(-1px); }
  .btn-ghost {
    padding: 8px 16px;
    border-radius: var(--radius);
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all var(--transition);
  }
  .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .btn-ghost.danger:hover { background: rgba(232,146,124,0.1); color: #E8927C; }

  /* ---- COMPOSE ---- */
  .compose {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
  }
  .compose-avatar {
    width: 40px; height: 40px;
    border-radius: var(--radius-full);
    background: var(--gradient-story);
    padding: 2px;
    flex-shrink: 0;
  }
  .compose-avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: var(--text-secondary);
    border: 2px solid var(--bg-primary);
  }
  .compose-body { flex:1; }
  .compose-input {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
    padding: 8px 0;
    min-height: 44px;
  }
  .compose-input::placeholder { color: var(--text-muted); }
  .compose-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .compose-tools { display:flex; gap:4px; align-items:center; }
  .compose-tool {
    width: 34px; height: 34px;
    border-radius: var(--radius-full);
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }
  .compose-tool:hover { background: rgba(61,50,44,0.06); }
  .compose-tool:hover svg { transform: scale(1.1); }
  .compose-tool svg { transition: all var(--transition); }

  /* Mood selector in compose */
  .compose-moods {
    display: flex;
    gap: 2px;
  }
  .compose-mood-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    padding: 0;
  }
  .compose-mood-btn:hover { background: var(--bg-elevated); transform: scale(1.15); }
  .compose-mood-btn.selected { border-color: var(--accent-blue); background: rgba(232,146,124,0.1); }

  /* ---- STORIES (Today's Mood) ---- */
  .stories-section {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .stories-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .stories-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .stories-row { display:flex; gap:16px; overflow-x:auto; scrollbar-width:none; }
  .stories-row::-webkit-scrollbar { display:none; }
  .story {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    flex-shrink:0;
    transition: transform var(--transition);
  }
  .story:hover { transform: translateY(-2px); }
  .story-ring {
    width: 60px; height: 60px;
    border-radius: 50%;
    padding: 2.5px;
    flex-shrink: 0;
  }
  .story-ring.has-mood { background: var(--gradient-story); }
  .story-ring.no-mood { background: var(--border); }
  .story-ring.today-ring {
    background: var(--gradient-story);
    animation: storyPulse 2s ease-in-out infinite;
  }
  @keyframes storyPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,168,154,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(240,168,154,0); }
  }
  .story-img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid var(--bg-primary);
    display: block;
  }
  .story-placeholder {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    border: 2.5px solid var(--bg-primary);
  }
  .story-label {
    font-size: 11px;
    color: var(--text-secondary);
    max-width: 66px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .story-ring-wrapper { position: relative; }

  /* ---- POST / DIARY CARDS ---- */
  .posts {}
  .post {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    transition: background var(--transition);
    cursor: pointer;
  }
  .post:hover { background: var(--bg-card-hover); }
  .post-header { display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
  .post-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .post-info { flex:1; min-width:0; }
  .post-name-row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .post-name { font-weight:700; font-size:14px; }
  .post-handle { color:var(--text-muted); font-size:13px; }
  .post-time { color:var(--text-muted); font-size:13px; }
  .post-time::before { content:'·'; margin:0 4px; }
  .post-more {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }
  .post-more:hover { background: rgba(61,50,44,0.06); color: var(--accent-blue); }
  .post-text { font-size:14px; line-height:1.6; margin-bottom:10px; word-break:break-word; white-space:pre-wrap; }

  /* Post image grid */
  .post-media { margin-bottom: 10px; }
  .post-media-grid {
    display: grid;
    gap: 4px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    max-height: 400px;
  }
  .post-media-grid.cols-1 { grid-template-columns: 1fr; }
  .post-media-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .post-media-grid.cols-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .post-media-grid.cols-3 .media-item:first-child { grid-row: span 2; }
  .media-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-elevated);
    min-height: 160px;
  }
  .media-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .media-item:hover img { transform: scale(1.05); }
  .media-counter {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-full);
  }

  /* Post actions */
  .post-stats {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .stat-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: var(--radius);
    transition: all var(--transition);
    font-family: inherit;
  }
  .stat-btn:hover { background: rgba(61,50,44,0.04); }
  .stat-btn.edit:hover { color: var(--accent-blue); }
  .stat-btn.delete:hover { color: var(--accent-pink); }

  /* ---- EXPLORE / RIGHT PANEL ---- */
  #searchInput:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(232,146,124,0.12); }
  #searchInput::placeholder { color: var(--text-muted); }
  .explore {
    width: 340px;
    flex-shrink: 0;
    padding: 12px 20px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .explore::-webkit-scrollbar { width:0; }

  .explore-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .explore-card-header {
    padding: 14px 16px;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.3px;
    border-bottom: 1px solid var(--border);
  }
  .explore-card-body { padding: 12px 16px; }

  /* Mood stats card */
  .mood-stat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
  }
  .mood-stat-emoji { font-size: 28px; flex-shrink: 0; }
  .mood-stat-info { flex:1; }
  .mood-stat-label { font-size: 14px; font-weight: 700; }
  .mood-stat-sub { font-size: 12px; color: var(--text-muted); }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 8px 0;
  }
  .stat-cell { text-align: center; }
  .stat-cell-num { font-size: 22px; font-weight: 800; color: var(--accent-blue); }
  .stat-cell-label { font-size: 11px; color: var(--text-muted); }

  /* Mini calendar in right panel */
  .mini-cal { width: 100%; }
  .mini-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .mini-cal-month { font-size: 13px; font-weight: 700; }
  .mini-cal-nav {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-muted);
    transition: all var(--transition);
  }
  .mini-cal-nav:hover { background: var(--bg-elevated); }
  .mini-cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .mini-cal-day-label {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 2px 0;
  }
  .mini-cal-day {
    aspect-ratio: 1;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
    transition: all var(--transition);
    color: var(--text-secondary);
  }
  .mini-cal-day:hover { background: var(--bg-elevated); }
  .mini-cal-day.other { opacity: 0.3; }
  .mini-cal-day.today { font-weight: 700; color: var(--accent-blue); }
  .mini-cal-day.has-entry { position: relative; }
  .mini-cal-day.has-entry::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent-blue);
  }

  .explore-footer { padding:0 4px 20px; }
  .explore-links { display:flex; flex-wrap:wrap; gap:4px 12px; margin-bottom:8px; }
  .explore-links a {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color var(--transition);
    white-space: nowrap;
  }
  .explore-links a:hover { color: var(--text-secondary); text-decoration:underline; }
  .explore-copyright { font-size:12px; color:var(--text-muted); }

  /* ---- WARM AMBIENT ---- */
  .warm-ambient {
    position: fixed;
    border-radius: 50%;
    filter: blur(180px);
    opacity: 0.12;
    pointer-events: none;
    z-index: -1;
  }
  .warm-ambient.amb-1 {
    width: 500px; height: 500px;
    background: #F0D5C8;
    top: -200px; left: -150px;
  }
  .warm-ambient.amb-2 {
    width: 400px; height: 400px;
    background: #E8D0C0;
    bottom: -150px; right: -100px;
  }
  .warm-ambient.amb-3 {
    width: 300px; height: 300px;
    background: #F5E0D4;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.08;
  }

  /* ---- EMPTY STATE ---- */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
  }
  .empty-icon { font-size: 56px; margin-bottom: 12px; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .empty-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; max-width: 300px; line-height: 1.5; }

  /* ---- WRITE VIEW (full page) ---- */
  .write-wrap { padding: 16px 20px 80px; }
  .write-section { margin-bottom: 20px; }
  .write-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .mood-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .mood-btn {
    width: 54px; height: 54px;
    border-radius: var(--radius);
    border: 2px solid var(--border);
    background: var(--bg-card);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all var(--transition);
    font-family: inherit;
  }
  .mood-btn:hover { border-color: var(--accent-blue); transform: translateY(-2px); box-shadow: var(--shadow); }
  .mood-btn.selected { border-color: var(--accent-blue); background: rgba(232,146,124,0.08); }
  .mood-emoji { font-size: 22px; }
  .mood-label { font-size: 10px; color: var(--text-muted); font-weight: 500; }

  .write-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-card);
    outline: none;
    transition: all var(--transition);
  }
  .write-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(232,146,124,0.12); }
  .write-input::placeholder { color: var(--text-muted); }
  .write-textarea {
    width: 100%;
    min-height: 180px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-card);
    outline: none;
    resize: vertical;
    line-height: 1.7;
    transition: all var(--transition);
  }
  .write-textarea:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(232,146,124,0.12); }
  .write-textarea::placeholder { color: var(--text-muted); }

  .image-upload-area { display: flex; gap: 10px; flex-wrap: wrap; }
  .image-upload-btn {
    width: 96px; height: 96px;
    border-radius: var(--radius);
    border: 2px dashed var(--border);
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all var(--transition);
    color: var(--text-muted);
    font-size: 12px;
  }
  .image-upload-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
  .image-upload-btn svg { width: 24px; height: 24px; }
  .image-preview {
    width: 96px; height: 96px;
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .image-preview img { width: 100%; height: 100%; object-fit: cover; }
  .image-preview .remove-img {
    position: absolute;
    top: 4px; right: 4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .write-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    gap: 12px;
  }
  .char-count { font-size: 12px; color: var(--text-muted); }

  /* ---- CALENDAR VIEW ---- */
  .cal-wrap { padding: 16px 20px 80px; max-width: 500px; margin: 0 auto; width: 100%; }
  .cal-nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-month-title { font-size: 18px; font-weight: 700; }
  .cal-nav-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    color: var(--text-secondary);
  }
  .cal-nav-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-label { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 8px 0; }
  .cal-day {
    aspect-ratio: 1;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .cal-day:hover { background: var(--bg-card); border-color: var(--border); }
  .cal-day.other-month { color: var(--text-muted); opacity: 0.35; }
  .cal-day.today { font-weight: 700; color: var(--accent-blue); }
  .cal-day.has-entry { background: var(--bg-card); border-color: var(--border); }
  .cal-day.selected { border-color: var(--accent-blue); background: rgba(232,146,124,0.08); }
  .cal-day .day-num { font-size: 13px; }
  .cal-day .day-mood { font-size: 18px; margin-top: 1px; }

  .cal-preview {
    margin-top: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
  }
  .cal-preview-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 12px; }

  /* ---- PROFILE VIEW ---- */
  .profile-wrap { padding: 16px 20px 80px; }
  .profile-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    text-align: center;
    margin-bottom: 20px;
  }
  .profile-avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--gradient-ins);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    margin: 0 auto 16px;
  }
  .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .profile-handle { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
  .profile-bio { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
  .profile-joined { font-size: 12px; color: var(--text-muted); }
  .profile-stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 24px;
  }
  .profile-stat { text-align: center; }
  .profile-stat-num { font-size: 28px; font-weight: 800; color: var(--accent-blue); }
  .profile-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .mood-dist {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
  }
  .mood-dist-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .mood-dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .mood-dist-emoji { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
  .mood-dist-bar-wrap { flex: 1; height: 8px; background: var(--bg-elevated); border-radius: 4px; overflow: hidden; }
  .mood-dist-bar { height: 100%; border-radius: 4px; background: var(--gradient-ins-h); transition: width 0.6s ease; }
  .mood-dist-count { font-size: 12px; color: var(--text-muted); width: 24px; text-align: right; flex-shrink: 0; }
  .profile-actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- MODAL ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61,50,44,0.3);
    backdrop-filter: blur(4px);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    padding: 28px;
    width: 90%;
    max-width: 420px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .modal-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-primary);
    outline: none;
    margin-bottom: 12px;
    transition: all var(--transition);
  }
  .modal-input:focus { border-color: var(--accent-blue); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  /* ---- TOAST ---- */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary);
    color: #fff;
    padding: 10px 24px;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all var(--transition-smooth);
    pointer-events: none;
    z-index: 600;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61,50,44,0.9);
    z-index: 700;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius-lg); object-fit: contain; }

  /* ---- MOBILE NAV ---- */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(253,248,245,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 6px 0 env(safe-area-inset-bottom);
    z-index: 200;
  }
  .mobile-nav-row { display:flex; justify-content:space-around; }
  .mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 10px;
    font-weight: 500;
    transition: all var(--transition);
    background: none;
    border: none;
    font-family: inherit;
  }
  .mobile-nav-item.active { color: var(--accent-blue); }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }
  .post { animation: fadeInUp 0.4s ease-out both; }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(1); }
    75% { transform: scale(1.3); }
  }
  .like-anim { animation: heartbeat 0.6s ease-in-out; }

  /* ---- SCROLLBAR ---- */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 1200px) {
    .explore { width: 280px; padding: 12px; }
  }
  @media (max-width: 1000px) {
    .explore { display: none; }
    .feed { max-width: none; }
  }
  @media (max-width: 680px) {
    .sidebar { display: none; }
    .mobile-nav { display: block; }
    .feed { border-right: none; }
    .compose { padding: 12px 16px; }
    .post { padding: 12px 16px; }
    .stories-section { padding: 12px 16px; }
    .topbar { padding: 10px 16px; }
    .write-wrap { padding: 12px 16px 80px; }
    .cal-wrap { padding: 12px 16px 80px; }
    .profile-wrap { padding: 12px 16px 80px; }
    .post-media-grid { border-radius: 0; margin: 0 -16px; }
    .mood-btn { width: 46px; height: 46px; }
    .mood-emoji { font-size: 18px; }
    .image-upload-btn, .image-preview { width: 80px; height: 80px; }
    .profile-avatar { width: 64px; height: 64px; font-size: 28px; }
    .profile-stats-row { gap: 20px; }
    .profile-stat-num { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="warm-ambient amb-1"></div>
<div class="warm-ambient amb-2"></div>
<div class="warm-ambient amb-3"></div>

<div class="app">

  <!-- ====== SIDEBAR ====== -->
  <aside class="sidebar">
    <a class="logo" href="#home">
      <div class="logo-icon">⌐</div>
      <span class="logo-text">INK</span>
    </a>
    <nav class="nav">
      <a class="nav-item active" href="#home" data-route="home">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        日记
      </a>
      <a class="nav-item" href="#write" data-route="write">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
        写日记
      </a>
      <a class="nav-item" href="#calendar" data-route="calendar">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        心情日历
      </a>
      <a class="nav-item" href="#profile" data-route="profile">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        我的
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card" onclick="router.navigate('profile')">
        <div class="user-avatar">
          <div class="user-avatar-placeholder" id="sidebarAvatar">?</div>
        </div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">未设置</div>
          <div class="user-handle" id="sidebarHandle">点击设置资料</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ====== MAIN ====== -->
  <main class="main">
    <div class="feed">

      <!-- === HOME VIEW === -->
      <div class="view active" id="view-home">
        <!-- Topbar -->
        <div class="topbar">
          <span class="topbar-title">为你推荐</span>
          <button class="btn-outline" onclick="router.navigate('write')">✏️ 写日记</button>
        </div>

        <!-- Compose - Quick Diary Entry -->
        <div class="compose">
          <div class="compose-avatar">
            <div class="compose-avatar-inner" id="composeAvatar">?</div>
          </div>
          <div class="compose-body">
            <textarea class="compose-input" id="quickContent" placeholder="今天心情如何...？" rows="1"></textarea>
            <div class="compose-actions">
              <div class="compose-tools">
                <div class="compose-moods" id="quickMoods"></div>
                <button class="compose-tool" onclick="document.getElementById('quickImageInput').click()" title="添加图片">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8927C" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </button>
              </div>
              <input type="file" id="quickImageInput" accept="image/*" multiple style="display:none" onchange="quickImageHandler.addImages(this)">
              <button class="btn-post" onclick="app.quickPublish()">发布</button>
            </div>
            <div id="quickImagePreviews" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;"></div>
          </div>
        </div>

        <!-- Today's Mood (Stories style) -->
        <div class="stories-section">
          <div class="stories-header">
            <span class="stories-title">今日心情</span>
          </div>
          <div class="stories-row" id="moodStories"></div>
        </div>

        <!-- Diary Cards -->
        <div class="posts" id="diaryPosts"></div>
        <div class="empty-state" id="emptyHome" style="display:none">
          <div class="empty-icon">📝</div>
          <div class="empty-title">还没有日记</div>
          <div class="empty-desc">在上方快速记录今天的心情，或点击"写日记"进入完整编辑器</div>
        </div>
      </div>

      <!-- === WRITE VIEW (full editor) === -->
      <div class="view" id="view-write">
        <div class="topbar">
          <span class="topbar-title" id="writeTitle">新日记</span>
          <button class="btn-ghost" onclick="router.navigate('home')">取消</button>
        </div>
        <div class="write-wrap">
          <div class="write-section">
            <label class="write-label">今日心情</label>
            <div class="mood-picker" id="moodPicker"></div>
          </div>
          <div class="write-section">
            <label class="write-label">标题</label>
            <input class="write-input" type="text" id="diaryTitle" placeholder="给你的日记起个标题..." maxlength="60">
          </div>
          <div class="write-section">
            <label class="write-label">内容</label>
            <textarea class="write-textarea" id="diaryContent" placeholder="今天发生了什么...？"></textarea>
          </div>
          <div class="write-section">
            <label class="write-label">图片</label>
            <div class="image-upload-area" id="imageArea">
              <div class="image-upload-btn" onclick="document.getElementById('imageInput').click()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                添加图片
              </div>
            </div>
            <input type="file" id="imageInput" accept="image/*" multiple style="display:none" onchange="imageHandler.addImages(this)">
          </div>
          <div class="write-footer">
            <span class="char-count" id="charCount">0 字</span>
            <button class="btn-post" id="btnSave" onclick="app.saveEntry()">保存日记</button>
          </div>
          <input type="hidden" id="editId" value="">
          <input type="hidden" id="editDate" value="">
        </div>
      </div>

      <!-- === CALENDAR VIEW === -->
      <div class="view" id="view-calendar">
        <div class="topbar">
          <span class="topbar-title">🗓️ 心情日历</span>
          <button class="btn-outline" onclick="calendarView.goToday()">今天</button>
        </div>
        <div class="cal-wrap">
          <div class="cal-nav-row">
            <button class="cal-nav-btn" onclick="calendarView.prevMonth()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="cal-month-title" id="calMonthTitle"></span>
            <button class="cal-nav-btn" onclick="calendarView.nextMonth()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-preview" id="calPreview">
            <div class="cal-preview-empty">点击某一天查看详情</div>
          </div>
        </div>
      </div>

      <!-- === PROFILE VIEW === -->
      <div class="view" id="view-profile">
        <div class="topbar">
          <span class="topbar-title">👤 我的</span>
          <button class="btn-outline" onclick="app.openProfileEdit()">编辑资料</button>
        </div>
        <div class="profile-wrap">
          <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-name" id="profileName">未设置</div>
            <div class="profile-handle" id="profileHandle">@unknown</div>
            <div class="profile-bio" id="profileBio">还没有个人简介...</div>
            <div class="profile-joined" id="profileJoined"></div>
          </div>
          <div class="profile-stats-row">
            <div class="profile-stat">
              <div class="profile-stat-num" id="statTotal">0</div>
              <div class="profile-stat-label">总日记</div>
            </div>
            <div class="profile-stat">
              <div class="profile-stat-num" id="statMonth">0</div>
              <div class="profile-stat-label">本月</div>
            </div>
            <div class="profile-stat">
              <div class="profile-stat-num" id="statStreak">0</div>
              <div class="profile-stat-label">连续天数</div>
            </div>
          </div>
          <div class="mood-dist">
            <div class="mood-dist-title">本月心情分布</div>
            <div id="moodDist"></div>
          </div>
          <div class="profile-actions-row">
            <button class="btn-outline" onclick="app.exportData()">导出数据</button>
            <button class="btn-outline" onclick="document.getElementById('importInput').click()">导入数据</button>
            <input type="file" id="importInput" accept=".json" style="display:none" onchange="app.importData(this)">
            <button class="btn-ghost danger" onclick="app.clearAllData()">清除所有数据</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ====== RIGHT PANEL ====== -->
  <aside class="explore" id="explorePanel">
    <!-- Search -->

<script>
// ==================== MOODS ====================
const MOODS = [
  { key: 'happy',    emoji: '😊', label: '开心' },
  { key: 'calm',     emoji: '😌', label: '平静' },
  { key: 'excited',  emoji: '🤩', label: '兴奋' },
  { key: 'love',     emoji: '🥰', label: '恋爱' },
  { key: 'sad',      emoji: '😢', label: '难过' },
  { key: 'anxious',  emoji: '😰', label: '焦虑' },
  { key: 'angry',    emoji: '😡', label: '生气' },
  { key: 'tired',    emoji: '😴', label: '疲惫' }
];
const MOOD_MAP = Object.fromEntries(MOODS.map(m => [m.key, m]));
const QUICK_MOODS = MOODS.slice(0, 5); // First 5 for quick picker

// ==================== INDEXED DB ====================
const DB = (() => {
  const DB_NAME = 'MoodDiaryDB';
  const DB_VER = 1;
  const STORE = 'entries';
  let db = null;

  async function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) {
          const store = d.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('date', 'date', { unique: false });
        }
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  function getStore(mode = 'readonly') {
    return db.transaction(STORE, mode).objectStore(STORE);
  }

  function promisify(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function add(entry) { return promisify(getStore('readwrite').add(entry)); }
  async function put(entry) { return promisify(getStore('readwrite').put(entry)); }
  async function getAll() { return promisify(getStore().getAll()); }

  async function getByDate(date) {
    const idx = getStore().index('date');
    return promisify(idx.getAll(date));
  }

  async function getAllByDate() {
    const all = await getAll();
    const map = {};
    for (const e of all) {
      if (!map[e.date]) map[e.date] = [];
      map[e.date].push(e);
    }
    return map;
  }

  async function remove(id) { return promisify(getStore('readwrite').delete(id)); }
  async function count() { return promisify(getStore().count()); }

  async function importEntries(entries) {
    const store = getStore('readwrite');
    await promisify(store.clear());
    for (const e of entries) await promisify(store.add(e));
  }

  return { open, add, put, getAll, getByDate, getAllByDate, remove, count, importEntries };
})();

// ==================== USER STORE ====================
const UserStore = (() => {
  const KEY = 'mooddiary_user';
  const defaults = { name: '', handle: '', bio: '', createdAt: '' };

  function get() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? { ...defaults, ...JSON.parse(raw) } : { ...defaults };
    } catch { return { ...defaults }; }
  }

  function save(user) { localStorage.setItem(KEY, JSON.stringify(user)); }

  function getInitial() {
    const name = get().name || '';
    return name ? name.charAt(0).toUpperCase() : '?';
  }

  return { get, save, getInitial };
})();

// ==================== IMAGE HANDLER ====================
const imageHandler = (() => {
  let images = [];
  function reset() { images = []; }
  function getImages() { return [...images]; }
  function setImages(imgs) { images = [...imgs]; }

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 800;
          let w = img.width, h = img.height;
          if (w > maxW) { h = h * maxW / w; w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function addImages(input) {
    if (images.length >= 4) { app.toast('最多添加 4 张图片'); return; }
    for (const file of input.files) {
      if (images.length >= 4) break;
      const dataUrl = await compressImage(file);
      images.push(dataUrl);
    }
    renderPreviews();
    input.value = '';
  }

  function removeImage(idx) { images.splice(idx, 1); renderPreviews(); }

  function renderPreviews() {
    const area = document.getElementById('imageArea');
    area.innerHTML = images.map((img, i) => `
      <div class="image-preview">
        <img src="${img}" alt="">
        <button class="remove-img" onclick="imageHandler.removeImage(${i})">&times;</button>
      </div>
    `).join('') + (images.length < 4 ? `
      <div class="image-upload-btn" onclick="document.getElementById('imageInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        添加图片
      </div>
    ` : '');
  }

  return { reset, getImages, setImages, addImages, removeImage, renderPreviews, compressImage };
})();

// Quick image handler (for compose)
const quickImageHandler = (() => {
  let images = [];
  function getImages() { return [...images]; }
  function reset() { images = []; }

  async function addImages(input) {
    if (images.length >= 2) { app.toast('快捷发布最多添加 2 张图片'); return; }
    for (const file of input.files) {
      if (images.length >= 2) break;
      const dataUrl = await imageHandler.compressImage(file);
      images.push(dataUrl);
    }
    renderPreviews();
    input.value = '';
  }

  function renderPreviews() {
    const area = document.getElementById('quickImagePreviews');
    area.innerHTML = images.map((img, i) => `
      <div class="image-preview" style="width:64px;height:64px;">
        <img src="${img}" alt="">
        <button class="remove-img" onclick="quickImageHandler.removeImage(${i})">&times;</button>
      </div>
    `).join('');
  }

  function removeImage(idx) { images.splice(idx, 1); renderPreviews(); }

  return { getImages, reset, addImages, removeImage, renderPreviews };
})();

// ==================== HOME VIEW ====================
const homeView = {
  async render() {
    const list = document.getElementById('diaryPosts');
    const empty = document.getElementById('emptyHome');
    const entries = await DB.getAll();
    entries.sort((a, b) => b.createdAt - a.createdAt);

    if (entries.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'flex';
    } else {
      empty.style.display = 'none';
      list.innerHTML = entries.map((e, i) => {
        const mood = MOOD_MAP[e.moodKey] || MOODS[0];
        const d = new Date(e.createdAt);
        const now = new Date();
        const diffMs = now - d;
        const diffMin = Math.floor(diffMs / 60000);
        const diffHr = Math.floor(diffMs / 3600000);
        let timeAgo;
        if (diffMin < 1) timeAgo = '刚刚';
        else if (diffMin < 60) timeAgo = `${diffMin}分钟前`;
        else if (diffHr < 24) timeAgo = `${diffHr}小时前`;
        else timeAgo = `${Math.floor(diffHr / 24)}天前`;

        const imagesHtml = e.images && e.images.length ? `
          <div class="post-media">
            <div class="post-media-grid cols-${Math.min(e.images.length, 2)}">
              ${e.images.map(img => `<div class="media-item"><img src="${img}" alt="" onclick="event.stopPropagation();app.openLightbox('${img.replace(/'/g, "\\'")}')"></div>`).join('')}
            </div>
          </div>
        ` : '';

        return `
          <article class="post" style="animation-delay:${i*0.04}s" onclick="router.navigate('write'); setTimeout(()=>app.editEntry('${e.id}'),50)">
            <div class="post-header">
              <div class="post-avatar">${mood.emoji}</div>
              <div class="post-info">
                <div class="post-name-row">
                  <span class="post-name">${mood.label}</span>
                  ${e.title ? `<span class="post-handle">· ${app.escHtml(e.title)}</span>` : ''}
                </div>
                <span class="post-time">${timeAgo}</span>
              </div>
              <button class="post-more" onclick="event.stopPropagation();app.deleteEntry('${e.id}')" title="删除">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
            </div>
            ${e.content ? `<div class="post-text">${app.escHtml(e.content).substring(0, 280)}${e.content.length > 280 ? '...' : ''}</div>` : ''}
            ${imagesHtml}
            <div class="post-stats">
              <button class="stat-btn edit" onclick="event.stopPropagation();router.navigate('write'); setTimeout(()=>app.editEntry('${e.id}'),50)">✏️ 编辑</button>
              <button class="stat-btn delete" onclick="event.stopPropagation();app.deleteEntry('${e.id}')">🗑️ 删除</button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Render mood stories
    this.renderMoodStories(entries);

    // Render quick mood picker
    const picker = document.getElementById('quickMoods');
    const selected = picker.dataset.selected || 'calm';
    picker.innerHTML = QUICK_MOODS.map(m => `
      <button class="compose-mood-btn${m.key === selected ? ' selected' : ''}" data-mood="${m.key}" onclick="app.selectQuickMood(this)" title="${m.label}">${m.emoji}</button>
    `).join('');
  },

  renderMoodStories(entries) {
    const row = document.getElementById('moodStories');
    const today = new Date();
    const entryMap = {};
    for (const e of entries) {
      if (!entryMap[e.date]) entryMap[e.date] = e;
    }

    let html = '';
    for (let i = 5; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const entry = entryMap[dateStr];
      const mood = entry ? MOOD_MAP[entry.moodKey] : null;
      const dayLabel = i === 0 ? '今天' : i === 1 ? '昨天' : ['日','一','二','三','四','五','六'][d.getDay()];
      const isToday = i === 0;

      html += `
        <div class="story" ${mood ? `onclick="router.navigate('write'); setTimeout(()=>app.editEntry('${entry.id}'),50)"` : `onclick="app.quickMoodForDate('${dateStr}')"`}>
          <div class="story-ring-wrapper">
            <div class="story-ring ${isToday ? 'today-ring' : mood ? 'has-mood' : 'no-mood'}">
              <div class="story-placeholder" style="${mood ? '' : 'font-size:20px;'}">${mood ? mood.emoji : '+'}</div>
            </div>
          </div>
          <span class="story-label">${dayLabel}</span>
        </div>
      `;
    }
    row.innerHTML = html;
  }
};

// ==================== CALENDAR VIEW ====================
const calendarView = (() => {
  let year, month, selectedDate = '';

  function init() {
    const now = new Date();
    year = now.getFullYear();
    month = now.getMonth();
  }

  function goToday() {
    const now = new Date();
    year = now.getFullYear();
    month = now.getMonth();
    selectedDate = '';
    render();
  }

  function prevMonth() { month--; if (month < 0) { month = 11; year--; } selectedDate = ''; render(); }
  function nextMonth() { month++; if (month > 11) { month = 0; year++; } selectedDate = ''; render(); }

  async function render() {
    document.getElementById('calMonthTitle').textContent = `${year}年 ${month + 1}月`;

    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const entryMap = await DB.getAllByDate();

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dayLabels = ['日','一','二','三','四','五','六'];
    let html = dayLabels.map(l => `<div class="cal-day-label">${l}</div>`).join('');

    // Prev month fill
    const prevDays = new Date(year, month, 0).getDate();
    for (let i = firstDay - 1; i >= 0; i--) {
      const d = prevDays - i;
      const pMonth = month === 0 ? 11 : month - 1;
      const pYear = month === 0 ? year - 1 : year;
      const dateStr = `${pYear}-${String(pMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const entries = entryMap[dateStr] || [];
      const mood = entries.length > 0 ? (MOOD_MAP[entries[0].moodKey] || MOODS[0]) : null;
      html += `<div class="cal-day other-month">${mood ? `<span class="day-mood">${mood.emoji}</span>` : `<span class="day-num">${d}</span>`}</div>`;
    }

    // Current month
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const entries = entryMap[dateStr] || [];
      const mood = entries.length > 0 ? (MOOD_MAP[entries[0].moodKey] || MOODS[0]) : null;
      let cls = 'cal-day';
      if (dateStr === todayStr) cls += ' today';
      if (mood) cls += ' has-entry';
      if (dateStr === selectedDate) cls += ' selected';
      html += `<div class="${cls}" onclick="calendarView.selectDay('${dateStr}')">
        <span class="day-num">${d}</span>
        ${mood ? `<span class="day-mood">${mood.emoji}</span>` : ''}
      </div>`;
    }

    // Next month fill
    const remaining = 42 - (firstDay + daysInMonth);
    for (let d = 1; d <= remaining; d++) {
      html += `<div class="cal-day other-month"><span class="day-num">${d}</span></div>`;
    }

    document.getElementById('calGrid').innerHTML = html;
    await renderPreview();
  }

  async function selectDay(dateStr) { selectedDate = dateStr; await render(); }

  async function renderPreview() {
    const preview = document.getElementById('calPreview');
    if (!selectedDate) {
      preview.innerHTML = '<div class="cal-preview-empty">点击某一天查看详情</div>';
      return;
    }

    const entries = await DB.getByDate(selectedDate);
    if (entries.length === 0) {
      preview.innerHTML = `<div class="cal-preview-empty">${selectedDate} 没有日记</div>`;
      return;
    }

    preview.innerHTML = entries.map(e => {
      const mood = MOOD_MAP[e.moodKey] || MOODS[0];
      return `
        <div class="post" style="margin-bottom:6px;border:1px solid var(--border);border-radius:var(--radius-lg);" onclick="router.navigate('write'); setTimeout(()=>app.editEntry('${e.id}'),50)">
          <div class="post-header">
            <div class="post-avatar">${mood.emoji}</div>
            <div class="post-info">
              <div class="post-name">${mood.label}</div>
              ${e.title ? `<div class="post-handle">${app.escHtml(e.title)}</div>` : ''}
            </div>
          </div>
          ${e.content ? `<div class="post-text">${app.escHtml(e.content).substring(0, 120)}${e.content.length > 120 ? '...' : ''}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  init();
  return { render, goToday, prevMonth, nextMonth, selectDay };
})();

// ==================== PROFILE VIEW ====================
const profileView = {
  async render() {
    const user = UserStore.get();
    document.getElementById('profileAvatar').textContent = UserStore.getInitial();
    document.getElementById('profileName').textContent = user.name || '未设置';
    document.getElementById('profileHandle').textContent = user.handle || '@unknown';
    document.getElementById('profileBio').textContent = user.bio || '还没有个人简介...';
    document.getElementById('profileJoined').textContent = user.createdAt ? `加入于 ${user.createdAt}` : '';

    const entries = await DB.getAll();
    document.getElementById('statTotal').textContent = entries.length;

    const now = new Date();
    const thisMonth = entries.filter(e => {
      const d = new Date(e.createdAt);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
    document.getElementById('statMonth').textContent = thisMonth.length;

    document.getElementById('statStreak').textContent = calcStreak(entries);

    // Mood distribution
    const dist = {};
    for (const e of thisMonth) dist[e.moodKey] = (dist[e.moodKey] || 0) + 1;
    const distHtml = MOODS.map(m => {
      const count = dist[m.key] || 0;
      const pct = thisMonth.length ? Math.round((count / thisMonth.length) * 100) : 0;
      return `
        <div class="mood-dist-row">
          <span class="mood-dist-emoji">${m.emoji}</span>
          <span style="font-size:11px;color:var(--text-muted);width:28px;">${m.label}</span>
          <div class="mood-dist-bar-wrap"><div class="mood-dist-bar" style="width:${pct}%"></div></div>
          <span class="mood-dist-count">${count}</span>
        </div>
      `;
    }).join('');
    document.getElementById('moodDist').innerHTML = distHtml || '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px;">本月暂无心情记录</div>';
  }
};

function calcStreak(entries) {
  if (entries.length === 0) return 0;
  const dates = new Set(entries.map(e => e.date));
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (dates.has(dateStr)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      if (i === 0) { d.setDate(d.getDate() - 1); continue; }
      break;
    }
  }
  return streak;
}

// ==================== RIGHT PANEL ====================
async function updateRightPanel() {
  const entries = await DB.getAll();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // Today's mood
  const todayEntries = entries.filter(e => e.date === todayStr);
  const todayEmoji = document.getElementById('todayMoodEmoji');
  const todayLabel = document.getElementById('todayMoodLabel');
  const todaySub = document.getElementById('todayMoodSub');
  if (todayEntries.length > 0) {
    const mood = MOOD_MAP[todayEntries[0].moodKey] || MOODS[0];
    todayEmoji.textContent = mood.emoji;
    todayLabel.textContent = `今天的心情：${mood.label}`;
    todaySub.textContent = `已记录 ${todayEntries.length} 篇日记`;
  } else {
    todayEmoji.textContent = '😌';
    todayLabel.textContent = '今天还没有记录';
    todaySub.textContent = '记录今天的心情吧';
  }

  // Stats
  document.getElementById('rpStatTotal').textContent = entries.length;
  const thisMonth = entries.filter(e => {
    const d = new Date(e.createdAt);

  });

  miniCal.render();

// ==================== MINI CALENDAR ====================
const miniCal = (() => {
  let year, month;

  function init() {
    const now = new Date();
    year = now.getFullYear();
    month = now.getMonth();
  }

  function prevMonth() { month--; if (month < 0) { month = 11; year--; } render(); }
  function nextMonth() { month++; if (month > 11) { month = 0; year++; } render(); }

  async function render() {
    document.getElementById('miniCalMonth').textContent = `${year}年 ${month + 1}月`;

    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const entryMap = await DB.getAllByDate();

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dayLabels = ['日','一','二','三','四','五','六'];

    let html = dayLabels.map(l => `<div class="mini-cal-day-label">${l}</div>`).join('');

    // Prev month
    const prevDays = new Date(year, month, 0).getDate();
    for (let i = firstDay - 1; i >= 0; i--) {
      html += `<div class="mini-cal-day other">${prevDays - i}</div>`;
    }

    // Current month
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hasEntry = entryMap[dateStr] && entryMap[dateStr].length > 0;
      let cls = 'mini-cal-day';
      if (dateStr === todayStr) cls += ' today';
      if (hasEntry) cls += ' has-entry';
      html += `<div class="${cls}" onclick="app.goToDate('${dateStr}')">${d}</div>`;
    }

    // Next month
    const totalCells = firstDay + daysInMonth;
    const remaining = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
    for (let d = 1; d <= remaining; d++) {
      html += `<div class="mini-cal-day other">${d}</div>`;
    }

    document.getElementById('miniCalGrid').innerHTML = html;
  }

  init();
  return { render, prevMonth, nextMonth };
})();

// ==================== APP ====================
const app = {
  async init() {
    await DB.open();

    const user = UserStore.get();
    if (!user.createdAt) {
      user.createdAt = new Date().toLocaleDateString('zh-CN');
      UserStore.save(user);
    }

    // Full editor textarea char count
    document.getElementById('diaryContent').addEventListener('input', () => {
      const len = document.getElementById('diaryContent').value.length;
      document.getElementById('charCount').textContent = `${len} 字`;
    });

    // Quick compose textarea auto-resize (bind once)
    document.getElementById('quickContent').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    router._onChange();
  },

  escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },

  selectQuickMood(btn) {
    document.querySelectorAll('#quickMoods .compose-mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('quickMoods').dataset.selected = btn.dataset.mood;
  },

  async quickPublish() {
    const picker = document.getElementById('quickMoods');
    const moodKey = picker.dataset.selected || 'calm';
    const content = document.getElementById('quickContent').value.trim();
    if (!content) { this.toast('请写点什么吧'); return; }

    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    const entry = {
      id: 'entry_' + Date.now(),
      date: dateStr,
      moodKey,
      title: '',
      content,
      images: quickImageHandler.getImages(),
      createdAt: Date.now(),
      updatedAt: Date.now()
    };

    await DB.add(entry);

    // Reset
    document.getElementById('quickContent').value = '';
    document.getElementById('quickContent').style.height = 'auto';
    quickImageHandler.reset();
    quickImageHandler.renderPreviews();

    this.toast('日记已发布 🎉');
    await homeView.render();
    await updateRightPanel();
  },

  async searchEntries(query) {
    const resultsDiv = document.getElementById('searchResults');
    if (!query || query.trim().length === 0) {
      resultsDiv.style.display = 'none';
      return;
    }

    const entries = await DB.getAll();
    const q = query.toLowerCase();
    const matched = entries.filter(e =>
      e.content.toLowerCase().includes(q) ||
      e.title.toLowerCase().includes(q) ||
      MOOD_MAP[e.moodKey]?.label.includes(q)
    );
    matched.sort((a, b) => b.createdAt - a.createdAt);

    if (matched.length === 0) {
      resultsDiv.style.display = 'block';
      resultsDiv.innerHTML = '<div class="explore-card"><div class="explore-card-body" style="padding:16px;color:var(--text-muted);font-size:13px;text-align:center;">未找到匹配的日记</div></div>';
      return;
    }

    resultsDiv.style.display = 'block';
    resultsDiv.innerHTML = `<div class="explore-card">
      <div class="explore-card-header">搜索结果 (${matched.length})</div>
      <div class="explore-card-body" style="padding:0;">
        ${matched.slice(0, 5).map(e => {
          const mood = MOOD_MAP[e.moodKey] || MOODS[0];
          return `
            <div style="padding:10px 16px;cursor:pointer;transition:all var(--transition);border-bottom:1px solid var(--border);" onmouseover="this.style.background='var(--bg-card-hover)'" onmouseout="this.style.background=''" onclick="router.navigate('write');setTimeout(()=>app.editEntry('${e.id}'),50)">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:20px;">${mood.emoji}</span>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${app.escHtml(e.title || e.content).substring(0, 40)}</div>
                  <div style="font-size:11px;color:var(--text-muted);">${mood.label} · ${e.date}</div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
        ${matched.length > 5 ? `<div style="padding:10px 16px;color:var(--text-muted);font-size:12px;text-align:center;">还有 ${matched.length - 5} 条结果...</div>` : ''}
      </div>
    </div>`;
  },

  async quickMoodForDate(dateStr) {
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    if (dateStr === todayStr) {
      document.getElementById('quickContent').focus();
      this.toast('记录今天的心情吧');
    } else {
      // Navigate to write view with date pre-filled for past days
      document.getElementById('editDate').value = dateStr;
      router.navigate('write');
      this.toast(`补记 ${dateStr} 的心情`);
    }
  },

  async goToDate(dateStr) {
    router.navigate('calendar');
    // Wait for calendar view to be active, then select the date
    setTimeout(async () => {
      await calendarView.selectDay(dateStr);
    }, 150);
  },

  async saveEntry() {
    const moodBtn = document.querySelector('#moodPicker .mood-btn.selected');
    if (!moodBtn) { this.toast('请选择心情'); return; }
    const moodKey = moodBtn.dataset.mood;
    const title = document.getElementById('diaryTitle').value.trim();
    const content = document.getElementById('diaryContent').value.trim();
    if (!content && !title) { this.toast('请输入标题或内容'); return; }

    const editId = document.getElementById('editId').value;
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    const entry = {
      id: editId || 'entry_' + Date.now(),
      date: document.getElementById('editDate').value || dateStr,
      moodKey,
      title,
      content,
      images: imageHandler.getImages(),
      createdAt: Date.now(),
      updatedAt: Date.now()
    };

    if (editId) {
      // Preserve original createdAt
      const all = await DB.getAll();
      const existing = all.find(e => e.id === editId);
      if (existing) entry.createdAt = existing.createdAt;
      await DB.put(entry);
    } else {
      await DB.add(entry);
    }

    document.getElementById('editId').value = '';
    document.getElementById('editDate').value = '';
    document.getElementById('diaryTitle').value = '';
    document.getElementById('diaryContent').value = '';
    document.getElementById('charCount').textContent = '0 字';
    imageHandler.reset();
    imageHandler.renderPreviews();
    this.toast(editId ? '日记已更新' : '日记已保存');
    router.navigate('home');
  },

  async editEntry(id) {
    const entries = await DB.getAll();
    const entry = entries.find(e => e.id === id);
    if (!entry) return;

    document.getElementById('editId').value = entry.id;
    document.getElementById('editDate').value = entry.date;
    document.getElementById('diaryTitle').value = entry.title || '';
    document.getElementById('diaryContent').value = entry.content || '';
    document.getElementById('charCount').textContent = `${(entry.content || '').length} 字`;

    imageHandler.setImages(entry.images || []);
    imageHandler.renderPreviews();

    document.querySelectorAll('#moodPicker .mood-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.mood === entry.moodKey);
    });

    writeView.render();
  },

  async deleteEntry(id) {
    if (!confirm('确定删除这篇日记吗？此操作不可撤销。')) return;
    await DB.remove(id);
    this.toast('日记已删除');
    await homeView.render();
    await updateRightPanel();
  },

  openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  },

  openProfileEdit() {
    const user = UserStore.get();
    document.getElementById('editName').value = user.name || '';
    document.getElementById('editHandle').value = user.handle || '';
    document.getElementById('editBio').value = user.bio || '';
    document.getElementById('modalOverlay').classList.add('open');
  },

  closeProfileEdit() {
    document.getElementById('modalOverlay').classList.remove('open');
  },

  saveProfile() {
    const user = UserStore.get();
    user.name = document.getElementById('editName').value.trim();
    user.handle = document.getElementById('editHandle').value.trim();
    if (user.handle && !user.handle.startsWith('@')) user.handle = '@' + user.handle;
    user.bio = document.getElementById('editBio').value.trim();
    UserStore.save(user);
    this.closeProfileEdit();
    profileView.render();
    updateSidebarUser();
    this.toast('资料已更新');
  },

  async exportData() {
    const data = {
      user: UserStore.get(),
      entries: await DB.getAll(),
      exportedAt: new Date().toISOString()
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mooddiary_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    this.toast('数据已导出');
  },

  async importData(input) {
    try {
      const file = input.files[0];
      if (!file) return;
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.entries || !Array.isArray(data.entries)) throw new Error('Invalid');

      if (!confirm(`即将导入 ${data.entries.length} 条日记，当前数据将被覆盖。确认？`)) return;

      if (data.user) UserStore.save(data.user);
      await DB.importEntries(data.entries);
      this.toast(`已导入 ${data.entries.length} 条日记`);
      router._onChange();
    } catch (e) {
      this.toast('导入失败：文件格式错误');
    }
    input.value = '';
  },

  async clearAllData() {
    if (!confirm('确定要清除所有日记数据吗？此操作不可撤销！')) return;
    if (!confirm('再次确认：所有日记和个人资料将被永久删除。')) return;

    const entries = await DB.getAll();
    for (const e of entries) await DB.remove(e.id);
    localStorage.removeItem('mooddiary_user');
    this.toast('所有数据已清除');
    location.reload();
  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
  }
};

// Modal click to close
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) app.closeProfileEdit();
});

// Init
app.init();

  navigator.serviceWorker.register('./sw.js')

    .catch((err) => console.log('SW registration failed:', err));
}
